name: Build and push depot backend image

on:
  push:
    branches: [master]
    paths:
      - "backend_mapato/**"
      - ".github/workflows/deploy-depot.yml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 15
          command: |
            docker buildx build \
              --push \
              --provenance=false \
              --tag magaiwa/depot:latest \
              --tag magaiwa/depot:${{ github.sha }} \
              ./backend_mapato

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 169.58.188.122
          username: deploy
          key: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /www/depot
            # Docker Hub occasionally 500s on a blob read mid-pull; retry
            # with backoff rather than failing the whole deploy on a blip.
            for attempt in 1 2 3 4 5; do
              if docker compose pull; then
                break
              fi
              if [ "$attempt" = "5" ]; then
                echo "docker compose pull failed after 5 attempts"
                exit 1
              fi
              echo "pull attempt $attempt failed, retrying in $((attempt * 5))s..."
              sleep $((attempt * 5))
            done
            docker compose up -d --remove-orphans
            sleep 3
            docker exec depot_backend php artisan migrate --force
            docker exec depot_backend php artisan config:cache
            docker exec depot_backend php artisan route:cache
            docker exec depot_backend php artisan view:clear
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 https://depot.magrethschools.sc.tz/api/health || echo 000)
            echo "Health check: HTTP $code"
