name: Build and push depot backend image

on:
  push:
    branches: [master]
    paths:
      - "backend_mapato/**"
      - ".github/workflows/deploy-depot.yml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend_mapato
          push: true
          tags: |
            magaiwa/depot:latest
            magaiwa/depot:${{ github.sha }}
