name: Build and push depot backend image

on:
  push:
    branches: [master]
    paths:
      - "backend_mapato/**"
      - ".github/workflows/deploy-depot.yml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend_mapato
          push: true
          tags: |
            magaiwa/depot:latest
            magaiwa/depot:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 169.58.188.122
          username: deploy
          key: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /www/depot
            docker compose pull
            docker compose up -d --remove-orphans
            sleep 3
            docker exec depot_backend php artisan migrate --force
            docker exec depot_backend php artisan config:cache
            docker exec depot_backend php artisan route:cache
            docker exec depot_backend php artisan view:clear
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 https://depot.magrethschools.sc.tz/api/health || echo 000)
            echo "Health check: HTTP $code"
