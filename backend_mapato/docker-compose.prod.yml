services:
  app:
    image: magaiwa/depot:latest
    container_name: depot_backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      SESSION_SECURE_COOKIE: "true"
      DB_CONNECTION: mysql
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-depot}
      DB_USERNAME: ${DB_USERNAME:-depot}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
    volumes:
      - depot_storage:/var/www/html/storage
    ports:
      - "127.0.0.1:8081:80"

volumes:
  depot_storage:
