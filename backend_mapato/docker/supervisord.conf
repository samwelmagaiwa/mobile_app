[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; QUEUE_CONNECTION=database in production, so queued jobs (driver predictions,
; anything dispatched later) only run if a worker is consuming the queue.
; Recycled hourly / every 1000 jobs so a leak can never grow unbounded;
; supervisor restarts it straight away.
[program:queue-worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --max-jobs=1000
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Runs routes/console.php schedules (rental bill generation, overdue marking,
; nightly driver prediction, expired-token pruning). schedule:work ticks once a
; minute in the foreground, so no host cron is needed. Its per-minute chatter on
; stdout is discarded; errors still go to stderr.
[program:scheduler]
command=php /var/www/html/artisan schedule:work
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/dev/null
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
