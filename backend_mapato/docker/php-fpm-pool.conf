; Overrides the image's default pm.max_children=5, which was too low for
; this app: a single screen load fires 10-15 concurrent API requests, so
; anything past the first 5 queued for a free worker and could exceed the
; client's timeout. Container has ~7.7GB available and this app uses only
; ~13MB/worker, so headroom here is not a concern.
[www]
pm = dynamic
pm.max_children = 25
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 10
