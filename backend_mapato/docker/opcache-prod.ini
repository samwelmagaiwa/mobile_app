; Production OPcache tuning. The default docker-php-ext-install opcache.ini
; leaves validate_timestamps=On, which makes OPcache stat() every included
; file on every single request to check whether it changed -- real overhead
; on an app this size, for a check that can never find anything: this is an
; immutable container built fresh per deploy, code never changes at runtime.
; Safe to disable entirely; a new deploy is always a new container with a
; cold, empty OPcache filled from the current code, not a live process that
; needs to notice a file changed underneath it.
opcache.validate_timestamps=0

; Give the interned-strings pool more room -- Laravel's class/string-heavy
; codebase benefits from this on top of the extension's own 128MB default
; for compiled scripts (that setting stays at its default, set elsewhere).
opcache.interned_strings_buffer=16
